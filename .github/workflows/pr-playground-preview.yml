name: PR Playground Preview

# Use workflow_run for privileged operations
# Runs with write permissions and access to secrets
# Operates on artifacts from the unprivileged build workflow
on:
  workflow_run:
    workflows: ['Build Plugin Zip']
    types:
      - completed

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Leaves a comment on a pull request with a link to test the changes in a WordPress Playground instance.
  playground-details:
    name: Comment on a pull request with Playground details
    runs-on: ubuntu-24.04
    # Only run if the build workflow succeeded and was triggered by a pull_request
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    outputs:
      artifact-url: ${{ steps.expose.outputs.artifact-url }}
      artifact-name: ${{ steps.expose.outputs.artifact-name }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve trusted PR metadata
        id: pr-metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The build runs untrusted PR code; the run's head SHA is the
            // only trusted value.
            const trustedSha = context.payload.workflow_run.head_sha;

            // Resolve the PR from the trusted head SHA, not the PR number in
            // the artifact name.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const pr = pulls.find(p => p.head.sha === trustedSha);
            if (!pr) {
              throw new Error(`Could not resolve an open pull request for head SHA ${trustedSha}`);
            }

            // Match the artifact by the name the trusted build derives, not by
            // prefix.
            const expectedName = `ai-plugin-zip-pr${pr.number}-${trustedSha}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.find(a => a.name === expectedName);
            if (!artifact) {
              throw new Error(`Could not find plugin artifact named ${expectedName}`);
            }

            core.setOutput('pr-number', String(pr.number));
            core.setOutput('commit-sha', trustedSha);
            // Where the PR's files live, for the sample content. A fork that
            // was deleted has no head repo; its commit is still reachable here.
            core.setOutput(
              'head-repo',
              pr.head.repo ? pr.head.repo.full_name : `${context.repo.owner}/${context.repo.repo}`
            );
            core.setOutput('artifact-name', artifact.name);

      - name: Expose built artifact
        id: expose
        uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4.0.0
        with:
          artifact-name: ${{ steps.pr-metadata.outputs.artifact-name }}
          artifact-filename: ai.zip
          pr-number: ${{ steps.pr-metadata.outputs.pr-number }}
          commit-sha: ${{ steps.pr-metadata.outputs.commit-sha }}
          artifact-source-run-id: ${{ github.event.workflow_run.id }}
          artifacts-to-keep: '2'

      # Trusted copy of the Live Preview blueprint from the default branch,
      # never the PR's own files.
      - name: Checkout Live Preview blueprint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .wordpress-org/blueprints
          sparse-checkout-cone-mode: false

      - name: Generate Playground blueprint JSON
        id: blueprint
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');

          const url = process.env.ARTIFACT_URL;
          if (!url) {
            throw new Error('ARTIFACT_URL is required');
          }

          // Reuse the Live Preview's steps, so PR previews get the same
          // sample content (tests/playground/README.md). The content and its
          // images come from the PR's own commit instead of trunk.
          const livePreview = JSON.parse(
            fs.readFileSync('.wordpress-org/blueprints/blueprint.json', 'utf8')
          );
          const trunkBase = 'https://raw.githubusercontent.com/WordPress/ai/trunk/';
          const prBase = `https://raw.githubusercontent.com/${process.env.HEAD_REPO}/${process.env.HEAD_SHA}/`;

          const steps = livePreview.steps.map((step) => {
            if (step.step === 'installPlugin') {
              return {
                step: 'installPlugin',
                pluginData: {
                  resource: 'url',
                  url,
                },
              };
            }
            if (step.step === 'importWxr') {
              return {
                ...step,
                file: { ...step.file, url: step.file.url.replace(trunkBase, prBase) },
                urlMapping: { [trunkBase]: prBase },
              };
            }
            return step;
          });

          const blueprint = {
            preferredVersions: livePreview.preferredVersions,
            features: livePreview.features,
            login: true,
            landingPage: '/wp-admin/admin.php?page=ai-wp-admin',
            steps,
          };

          console.log(`blueprint=${JSON.stringify(blueprint)}`);
          NODE
        env:
          ARTIFACT_URL: ${{ steps.expose.outputs.artifact-url }}
          HEAD_REPO: ${{ steps.pr-metadata.outputs.head-repo }}
          HEAD_SHA: ${{ steps.pr-metadata.outputs.commit-sha }}

      - name: Post Playground preview button
        uses: WordPress/action-wp-playground-pr-preview@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4.0.0
        with:
          mode: append-to-description
          blueprint: ${{ steps.blueprint.outputs.blueprint }}
          pr-number: ${{ steps.pr-metadata.outputs.pr-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
